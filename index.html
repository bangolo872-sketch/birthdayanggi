<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rundown Acara</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8fafc;
      margin: 0;
      padding: 0;
      color: #333;
    }

    header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 20px 10px;
    }

    header h1 {
      margin: 0;
      font-size: 1.8rem;
    }

    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .rundown {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      padding: 20px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }

    .item:last-child {
      border-bottom: none;
    }

    .time {
      font-weight: bold;
      color: #2563eb;
    }

    .activity {
      flex: 1;
      margin-left: 15px;
    }

    /* Responsif */
    @media (max-width: 600px) {
      .item {
        flex-direction: column;
        align-items: flex-start;
      }
      .activity {
        margin-left: 0;
        margin-top: 5px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Rundown Acara</h1>
    <p>Hari Sabtu, 27 September 2025</p>
  </header>
  <div class="container">
    <div class="rundown">
      <div class="item">
        <div class="time">08:00</div>
        <div class="activity">Registrasi Peserta</div>
      </div>
      <div class="item">
        <div class="time">09:00</div>
        <div class="activity">Pembukaan Acara</div>
      </div>
      <div class="item">
        <div class="time">10:00</div>
        <div class="activity">Istirahat</div>
      </div>
      <div class="item">
        <div class="time">11:00</div>
        <div class="activity">Otw BBQ</div>
      </div>
      <div class="item">
        <div class="time">12:00</div>
        <div class="activity">Bbqan</div>
      </div>
      <div class="item">
        <div class="time">13:00</div>
        <div class="activity">Pulang</div>
      </div>
            <div class="item">
        <div class="time">15:00/ Selesai</div>
        <div class="activity">Badminton sekalian nyate</div>
      </div>
    </div>
  </div>
</body>
</html>
