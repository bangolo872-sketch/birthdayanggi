<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Sayang ❤️</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
      font-family: 'Poppins', sans-serif;
    }
    #typing {
      white-space: pre-line; /* biar enter (paragraf) kebaca */
      text-align: center;
      font-size: 1.1rem;
      line-height: 1.6;
      color: #444;
    }
    .cursor {
      display: inline-block;
      width: 10px;
      background-color: #444;
      margin-left: 2px;
      animation: blink 0.7s infinite;
    }
    @keyframes blink {
      0%, 50%, 100% { opacity: 1; }
      25%, 75% { opacity: 0; }
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">
  <div class="bg-white shadow-2xl rounded-2xl p-8 max-w-2xl text-center">
    <h1 class="text-3xl font-bold text-pink-600 mb-6">🎉 Happy Birthday Sayang 🎉</h1>
    <p class="text-gray-700 text-lg mb-4">
      Hari ini spesial banget, karena ada orang paling indah di hidupku yang ulang tahun ❤️
    </p>
    <button 
      onclick="tampilKejutan()" 
      class="bg-pink-500 text-white px-6 py-2 rounded-full shadow-lg hover:bg-pink-600 transition">
      Klik untuk Kejutan 🎀
    </button>
    <div id="kejutan" class="hidden mt-6">
      <div id="typing"></div><span class="cursor hidden"></span>
    </div>
  </div>

  <!-- Audio Backsound -->
  <audio id="backsound" loop>
    <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mpeg">
    Browser kamu nggak mendukung audio 😢
  </audio>

  <script>
    const text = `Selamat ulang tahun, cintaku ❤️

Kamu tau nggak? Buat aku, kamu itu kayak cahaya lampu kota di malam gelap selalu jadi alasan aku nggak pernah takut jalan sendirian. Kamu juga kayak hujan pertama setelah musim kemarau panjang, yang bikin semua rasa gersang di hati berubah jadi sejuk dan hidup lagi.

Hari ini, aku nggak cuma ngerayain ulang tahunmu, tapi juga ngerayain keberuntungan terbesar dalam hidupku dipertemukan sama kamu. Kamu itu kayak buku favorit yang nggak pernah bikin bosan, setiap halaman punya cerita baru yang bikin aku jatuh cinta lagi dan lagi.

Semoga di usia baru ini, semua mimpimu pelan-pelan jadi nyata. Semoga senyum kamu terus jadi obat paling ampuh buat hari-hari aku. Dan semoga aku bisa terus jadi orang yang nemenin kamu, dari tawa paling kecil sampai doa paling dalam.

Kamu tau nggak, sayang? Kalau cinta itu bisa diukur, cintaku ke kamu udah kayak laut nggak kelihatan ujungnya, nggak ketebak dalamnya. Dan kalau cinta itu bisa disamakan, cintaku ke kamu kayak langit malam penuh bintang, nggak ada habisnya, selalu indah dilihat dari sudut mana pun.

Happy birthday ya, sayangku. Semoga semesta selalu jaga kamu, karena aku nggak pernah berhenti doain yang terbaik buatmu. Aku sayang kamu, lebih dari yang bisa aku tulis pake kata-kata, lebih dari yang bisa aku ucapin lewat suara. Kamu adalah rumahku, dan aku pengen terus pulang ke kamu, selamanya. 💕`;

    let i = 0;
    let typingStarted = false;

    function tampilKejutan() {
      const kejutan = document.getElementById("kejutan");
      const cursor = document.querySelector(".cursor");
      const backsound = document.getElementById("backsound");

      if (!typingStarted) {
        kejutan.classList.remove("hidden");
        cursor.classList.remove("hidden");
        typingStarted = true;
        backsound.play(); // play musik
        typeWriter();
      }
    }

    function typeWriter() {
      if (i < text.length) {
        document.getElementById("typing").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 30); // kecepatan ngetik
      }
    }
  </script>
</body>
</html>
